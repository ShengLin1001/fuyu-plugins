# Comments the v3 report on pull requests from forks: their own check run only
# gets a read-only token. This runs the default branch's code with a token that
# may comment, on the check run's report artifact. The fork controls that
# artifact, so scripts/v3/comment.mjs posts it only on the pull request whose
# head is the commit that was checked, and flags pull requests that change
# anything besides plugins/ and themes/ (their report came from their own code).
# Same-repository pull requests are commented on by the check itself.
name: Comment the v3 report

on:
  workflow_run:
    workflows: ["Check submission"]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v3-report
          path: ${{ runner.temp }}/v3-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/v3/comment.mjs --body "$RUNNER_TEMP/v3-report/comment.md" --pr-file "$RUNNER_TEMP/v3-report/pr.json" --head-sha "$HEAD_SHA"
